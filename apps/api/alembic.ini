# Alembic configuration.
#
# The URL is deliberately absent. It comes from ``DATABASE_URL`` via
# ``migrations/env.py``, because the alternative is a connection string committed
# to the repo and a production migration run against the wrong database.
#
# In development ``AUTO_CREATE_SCHEMA=true`` means ``create_all`` builds the schema
# and Alembic is not in the boot path at all. Alembic exists for the first
# deployment that has data worth keeping; from that point ``AUTO_CREATE_SCHEMA``
# must be off and this is the only thing that touches DDL.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

# Filenames sort chronologically, which matters the moment two branches both add
# a migration and a human has to work out what ran in what order.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[post_write_hooks]
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format --line-length 120 REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
